<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SHOPPINGGRU.COM.BR | Domínio à venda</title>
  <meta name="description" content="O domínio SHOPPINGGRU.COM.BR está disponível para venda. Entre em contato para fazer uma proposta.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #17151c;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      width: 550px;
      height: 550px;
      border-radius: 50%;
      background: rgba(209, 166, 92, .10);
      top: -280px;
      right: -170px;
    }

    body::after {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: rgba(209, 166, 92, .06);
      bottom: -230px;
      left: -100px;
    }

    .container {
      width: 90%;
      max-width: 900px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .icon {
      font-size: 30px;
      margin-bottom: 18px;
      color: #d1a65c;
    }

    .tag {
      display: inline-block;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 50px;
      padding: 9px 18px;
      margin-bottom: 35px;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #d1a65c;
    }

    h1 {
      font-size: clamp(36px, 8vw, 78px);
      letter-spacing: -3px;
      margin-bottom: 18px;
    }

    .gru {
      color: #d1a65c;
    }

    h2 {
      font-size: clamp(22px, 4vw, 36px);
      font-weight: 400;
      margin-bottom: 25px;
    }

    p {
      max-width: 680px;
      margin: 0 auto 38px;
      color: #c1bdc5;
      font-size: 17px;
      line-height: 1.7;
    }

    .button {
      display: inline-block;
      padding: 17px 32px;
      background: #d1a65c;
      color: #17151c;
      text-decoration: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      transition: .25s;
    }

    .button:hover {
      transform: translateY(-3px);
      background: #e0bc7c;
    }

    .footer {
      margin-top: 55px;
      color: #716d76;
      font-size: 12px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="icon">◇</div>

    <div class="tag">Domínio disponível</div>

    <h1>SHOPPING<span class="gru">GRU</span></h1>

    <h2>Este domínio está à venda.</h2>

    <p>
      Um endereço comercial forte e fácil de lembrar para shopping,
      varejo, marketplace, guia de compras, ofertas e serviços
      relacionados a Guarulhos e região.
    </p>

    <a class="button"
       href="mailto:vanda@vanda.com.br?subject=Interesse%20no%20dom%C3%ADnio%20SHOPPINGGRU.COM.BR">
      TENHO INTERESSE NESTE DOMÍNIO
    </a>

    <div class="footer">
      SHOPPINGGRU.COM.BR
    </div>

  </main>

</body>
</html>
